tests:
  - name: precomposed entry includes canonical decomposition
    values: [üh]
    expected: [üh, "u\u0308h"]
  - name: unchanged entry is not duplicated
    values: [sch]
    expected: [sch]

mapping_tests:
  - name: precomposed mapping includes canonical decomposition
    mapping: {üh: ö}
    expected:
      - {key: üh, value: ö}
      - {key: "u\u0308h", value: "o\u0308"}
  - name: unchanged mapping remains available
    mapping: {ssz: szsz}
    expected:
      - {key: ssz, value: szsz}

geminate_tests:
  - name: compact digraph expands with its span
    rule: {lang: test, vowels: '', consonants: '', geminate_digraphs: {ssz: szsz}}
    word: asszony
    expanded: aszszony
    spans:
      - {start: 1, length: 4, compact: ssz}
  - name: span offsets count decomposed scalars
    rule: {lang: test, vowels: '', consonants: '', geminate_digraphs: {ssz: szsz}}
    word: "o\u0308ssz"
    expanded: "o\u0308szsz"
    spans:
      - {start: 2, length: 4, compact: ssz}

vowel_nucleus_rule_tests:
  - name: declaration order defines priority
    entries:
      - {suffix: e, vowel_offset: 0, outcome: silent}
      - {suffix: ed, vowel_offset: 0, outcome: preserve, preceded_by: [t, d]}
    expected: [e, ed]
  - name: out of range offset is rejected
    entries:
      - {suffix: e, vowel_offset: 1, outcome: silent}
    error: "invalid vowel offset for nucleus rule"
  - name: consonant target is rejected
    entries:
      - {suffix: ed, vowel_offset: 1, outcome: silent}
    error: "nucleus rule target is not a vowel"
  - name: unknown outcome is rejected
    entries:
      - {suffix: e, vowel_offset: 0, outcome: maybe}
    error: "invalid nucleus rule outcome"
  - name: multi-character predecessor is rejected
    entries:
      - {suffix: ed, vowel_offset: 0, outcome: silent, preceded_by: [th]}
    error: "predecessor must be one character"
  - name: unknown predecessor class is rejected
    entries:
      - {suffix: le, vowel_offset: 1, outcome: preserve, preceded_by_class: letter}
    error: "invalid nucleus rule predecessor class"
  - name: multi-letter vowel target is accepted
    entries:
      - {suffix: gue, vowel_offset: 1, vowel_length: 2, outcome: silent}
    expected: [gue]
  - name: vowel target cannot exceed suffix
    entries:
      - {suffix: e, vowel_offset: 0, vowel_length: 2, outcome: silent}
    error: "invalid vowel offset for nucleus rule"
