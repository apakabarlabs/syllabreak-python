name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 0.19.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/syllabreak/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: make install-tools
      - name: Install
        run: make install
      - name: Build
        run: make build
      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(venv/bin/python -c 'import syllabreak; print(syllabreak.__version__)')" = "${VERSION}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            gh release create "v${VERSION}" dist/* --generate-notes --target "${GITHUB_SHA}"
          fi
