name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 0.19.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: make install-tools
      - name: Install
        run: make install
      - name: Build
        run: make build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --target "${GITHUB_SHA}"
